<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz - FriendQuiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="logo">FriendQuiz</div>

    <!-- NAME SCREEN -->

    <div class="card" id="nameScreen">

      <h1 id="welcomeTitle">
        Welcome 👋
      </h1>

      <p>
        Enter your name to start this quiz.
      </p>

      <input
        type="text"
        id="participantName"
        placeholder="Your name"
        maxlength="40"
      >

      <button class="btn" onclick="startQuiz()">
        Start Quiz 🚀
      </button>

    </div>


    <!-- QUIZ SCREEN -->

    <div class="card hidden" id="quizScreen">

      <h1 id="quizTitle">
        Quiz
      </h1>

      <p id="progress"></p>

      <div id="questionContainer"></div>

      <button
        class="btn"
        id="nextButton"
        onclick="nextQuestion()"
      >
        Next
      </button>

    </div>


    <!-- RESULT SCREEN -->

    <div class="card hidden" id="resultScreen">

      <h1 id="resultTitle">
        Your Result 🎉
      </h1>

      <div class="score" id="scoreText"></div>

      <p id="resultMessage"></p>

      <button
        class="btn"
        onclick="location.href='index.html'"
      >
        Go Home
      </button>

    </div>

  </div>


  <script>

    const params =
      new URLSearchParams(window.location.search);

    const code =
      params.get("code");


    let quiz = null;

    let participantName = "";

    let currentQuestion = 0;

    let score = 0;

    let selectedAnswer = null;


    // Load quiz

    if (!code) {

      alert("Quiz code is missing.");

      window.location.href = "index.html";

    }


    quiz =
      JSON.parse(
        localStorage.getItem("quiz_" + code)
      );


    if (!quiz) {

      alert(
        "Quiz not found. Please check the quiz code."
      );

      window.location.href = "index.html";

    }


    // Show creator/quiz information

    document.getElementById("welcomeTitle").textContent =
      "Welcome to " + quiz.creatorName + "'s Quiz 👋";


    document.getElementById("quizTitle").textContent =
      quiz.title;


    // Start Quiz

    function startQuiz() {

      participantName =
        document
          .getElementById("participantName")
          .value
          .trim();


      if (!participantName) {

        alert("Please enter your name.");

        return;

      }


      document
        .getElementById("nameScreen")
        .classList.add("hidden");


      document
        .getElementById("quizScreen")
        .classList.remove("hidden");


      showQuestion();

    }


    // Show current question

    function showQuestion() {

      const question =
        quiz.questions[currentQuestion];


      selectedAnswer = null;


      document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        quiz.questions.length;


      const container =
        document.getElementById("questionContainer");


      container.innerHTML = "";


      const questionTitle =
        document.createElement("h2");


      questionTitle.textContent =
        question.question;


      container.appendChild(questionTitle);


      question.options.forEach(
        (option, index) => {

          const button =
            document.createElement("button");


          button.className =
            "option-button";


          button.textContent =
            option;


          button.onclick =
            function() {

              selectAnswer(index, button);

            };


          container.appendChild(button);

        }
      );


      const nextButton =
        document.getElementById("nextButton");


      if (
        currentQuestion ===
        quiz.questions.length - 1
      ) {

        nextButton.textContent =
          "See Result 🎉";

      } else {

        nextButton.textContent =
          "Next";

      }

    }


    // Select answer

    function selectAnswer(index, button) {

      selectedAnswer = index;


      const buttons =
        document.querySelectorAll(
          ".option-button"
        );


      buttons.forEach(
        btn => btn.classList.remove("selected")
      );


      button.classList.add("selected");

    }


    // Next question

    function nextQuestion() {

      if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;

      }


      const correctAnswer =
        quiz.questions[currentQuestion]
          .correctAnswer;


      if (selectedAnswer === correctAnswer) {

        score++;

      }


      currentQuestion++;


      if (
        currentQuestion >=
        quiz.questions.length
      ) {

        showResult();

      } else {

        showQuestion();

      }

    }


    // Show result

    function showResult() {

      document
        .getElementById("quizScreen")
        .classList.add("hidden");


      document
        .getElementById("resultScreen")
        .classList.remove("hidden");


      document.getElementById("resultTitle").textContent =
        participantName + "'s Result 🎉";


      document.getElementById("scoreText").textContent =
        score +
        " / " +
        quiz.questions.length;


      const percentage =
        Math.round(
          (score / quiz.questions.length) * 100
        );


      let message = "";


      if (percentage === 100) {

        message =
          "Perfect score! 🔥 You know them really well!";

      } else if (percentage >= 70) {

        message =
          "Great job! 😎 You know them pretty well.";

      } else if (percentage >= 40) {

        message =
          "Not bad! 😄 But you can know them better.";

      } else {

        message =
          "Oops! 😂 Looks like you need to know them better.";

      }


      document.getElementById("resultMessage").textContent =
        message;

    }

  </script>

</body>
</html>
